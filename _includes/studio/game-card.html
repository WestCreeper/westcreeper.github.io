{% assign game = include.game %}
<a class="game-card" href="{{ '/swf/games/' | append: game.id | append: '/' | relative_url }}" {% if include.filterable %}data-filter-item data-category="{{ game.category | escape }}" data-search="{{ game.title | escape }} {{ game.original_title | escape }} {{ game.description | escape }} {{ game.language | escape }}"{% endif %}>
  <div class="game-cover game-cover--{{ game.id }}"><img src="{{ game.cover | relative_url }}" alt="{{ game.title | escape }}游戏画面" loading="lazy" width="400" height="230"><span class="game-badge {% unless game.translated %}game-badge--original{% endunless %}">{{ game.language }}</span><span class="game-launch">{% include studio/icon.html name='play' %}</span><span class="game-cover-caption">{{ game.original_title }}</span></div>
  <div class="game-card-body"><div class="game-card-title"><h3>{{ game.title }}</h3><span aria-hidden="true">↗</span></div><p>{{ game.description }}</p><div class="game-card-meta"><span>{{ game.category }}</span><span class="play-label {% if game.play_note %}play-label--notice{% endif %}"><i></i>{{ game.play_status | default: '在线游玩' }}</span></div></div>
</a>
