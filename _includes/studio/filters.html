<div class="filter-bar"><div class="filter-chips" role="group" aria-label="分类筛选"><button class="filter-chip" data-filter="all" aria-pressed="true">全部</button>{% if include.type == 'games' %}{% assign categories = site.data.games | map: 'category' | uniq %}{% for category in categories %}<button class="filter-chip" data-filter="{{ category | escape }}" aria-pressed="false">{{ category }}</button>{% endfor %}{% else %}{% for tag in site.tags %}<button class="filter-chip" data-filter="{{ tag[0] | escape }}" aria-pressed="false">{{ tag[0] }} <span>{{ tag[1] | size }}</span></button>{% endfor %}{% endif %}</div><label class="filter-search">{% include studio/icon.html name='search' %}<input type="search" data-filter-search aria-label="搜索当前列表" placeholder="{% if include.type == 'games' %}找一款游戏…{% else %}搜索文章标题与摘要…{% endif %}"></label></div><p class="filter-count" data-filter-count role="status"></p>
