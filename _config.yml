# Site identity and GitHub Pages URL.
title: WestCreeper's Blog
url: https://westcreeper.github.io
baseurl: ""
description: >-
  西部苦力怕的自留地。记录 Flash 游戏的故事，分享汉化作品，让闪光的记忆继续运行。
lang: zh-Hans
timezone: Asia/Shanghai

author:
  name: 西部苦力怕
repository: WestCreeper/westcreeper.github.io

# Keep existing dated article URLs.
markdown: kramdown
highlighter: rouge
permalink: date
excerpt_separator: <!--more-->
license: CC-BY-NC-4.0

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Source documentation and local tools are not published.
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - PUBLISHING.md
  - BLOG_ARCHITECTURE.md
  - /tools
  - /local-preview
  - /vendor
  - /node_modules
