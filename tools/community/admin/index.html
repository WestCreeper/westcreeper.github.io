<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>讨论审核 · WestCreeper</title>
    <link rel="stylesheet" href="/admin/admin.css" />
    <script src="/admin/avatars.js" defer></script>
    <script src="/admin/admin.js" defer></script>
    <script src="/admin/management.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">WESTCREEPER / COMMUNITY</p>
        <h1>讨论审核台</h1>
        <p>先读一读，再让声音被看见。</p>
        <p id="identity"></p>
      </header>
      <nav class="management-tabs" aria-label="管理功能">
        <button type="button" data-panel="moderation-panel" aria-pressed="true">
          留言审核</button
        ><button type="button" data-panel="cookies-panel" aria-pressed="false">
          饼干管理</button
        ><button type="button" data-panel="inbox-panel" aria-pressed="false">
          邮件收件箱
        </button>
      </nav>
      <section id="moderation-panel" data-management-panel>
        <nav aria-label="审核队列">
          <label
            >查看
            <select id="filter">
              <option value="pending">待审核</option>
              <option value="approved">已公开</option>
              <option value="rejected">已拒绝</option>
              <option value="hidden">已隐藏</option>
              <option value="all">全部状态</option>
            </select></label
          >
          <label
            >分类<select id="category">
              <option value="">全部分类</option>
              <option value="game">游戏评论区</option>
              <option value="find">寻找游戏</option>
              <option value="feedback">问题建议</option>
              <option value="chat">闲聊交流</option>
            </select></label
          >
          <label
            >类型<select id="kind">
              <option value="">主帖与回复</option>
              <option value="topic">仅主帖</option>
              <option value="reply">仅回复</option>
            </select></label
          >
          <label
            >进度<select id="progress">
              <option value="">全部进度</option>
              <option value="open">待处理 / 寻找中</option>
              <option value="working">处理中 / 有线索</option>
              <option value="done">已解决 / 已找到</option>
            </select></label
          >
        </nav>
        <form id="search" class="search">
          <label
            >搜索昵称、标题或内容<input
              id="query"
              type="search"
              maxlength="100"
              placeholder="输入关键词" /></label
          ><label
            >饼干编号<input
              id="author"
              inputmode="numeric"
              maxlength="8"
              placeholder="8 位编号（可选）" /></label
          ><button id="refresh" type="submit">筛选 / 刷新</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
        <section id="entries" aria-label="审核内容"></section>
        <button id="more" hidden>加载下一页</button>
      </section>
      <section id="cookies-panel" data-management-panel hidden>
        <h2>饼干管理</h2>
        <p class="meta">
          编号关联站内发言，昵称不代表实名。恢复码仅在领取或重置时显示，后台不能读取原码。
        </p>
        <form id="cookies-search" class="search">
          <label>昵称或编号<input name="q" maxlength="100" /></label
          ><label
            >状态<select name="state">
              <option value="">全部</option>
              <option value="active">正常</option>
              <option value="banned">已停用</option>
            </select></label
          ><button>查询</button>
        </form>
        <p id="cookies-status" role="status"></p>
        <div id="cookies-list"></div>
        <button id="cookies-more" hidden>再看 20 个</button>
      </section>
      <section id="inbox-panel" data-management-panel hidden>
        <h2>邮件收件箱</h2>
        <p class="meta">
          仅接收 contact@westcreeper.com
          的求助。发信地址不证明饼干归属；不自动认领身份。这里只收信和记录处理进度，不发送回复；附件不保存。
        </p>
        <form id="inbox-search" class="search">
          <label>发件人、主题或正文<input name="q" maxlength="100" /></label
          ><label
            >状态<select name="state">
              <option value="">全部</option>
              <option value="unread">未读</option>
              <option value="read">已读</option>
              <option value="done">已处理</option>
            </select></label
          ><button>查询</button>
        </form>
        <p id="inbox-status" role="status"></p>
        <div id="inbox-list"></div>
        <button id="inbox-more" hidden>再看 20 封</button>
      </section>
      <footer>
        隐藏主帖也会收起公开回复。删除主帖会同时移除其回复，后台保留审计记录。编辑已公开内容将立即生效。昵称不代表经过身份认证。
      </footer>
    </main>
  </body>
</html>
